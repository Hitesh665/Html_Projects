<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="leftover_returns_AI.css">
</head>
<body>
    <h1>If you have any leftovers we encourage you not to waste it . Use it wisely to serve hungry animals by returning it to us on the station of your choice</h1>
    <label for="return_station">Choose the station where you wish to return the leftovers:</label>
    <br><br>
    <input type="text" placeholder="Start typing to search..." list="delivery_stations" name="re_st">
    <datalist id="delivery_stations">
            <option value="Delhi">Delhi</option>
            <option value="Asansol">Asansol</option>
            <option value="Bhadohi">Bhadohi</option>
            <option value="Varanasi">Varanasi</option>
            <option value="Lucknow">Lucknow</option>
            <option value="Roorkee">Roorkee</option>
            <option value="Phagwara">Phagwara</option>
            <option value="Jalandhar">Jalandhar</option>
            <option value="Kapurthala">Kapurthala</option>
            <option value="Chandigarh">Chandigarh</option>
    </datalist>
    <button type="submit" id="submit_response">
        <a href="thanks.html" id="go_to_thanks">Submit</a>
    </button>
</body>
</html>
